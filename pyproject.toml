# pyproject.toml — tool configuration ONLY, deliberately.
# Deckard is not pip-installed anywhere: the flatpak manifest copies the tree
# (io.github.nazbert.Deckard.yml: `cp . /app/bin/Deckard -r`), the AUR package
# builds a venv from requirements.txt and copies the tree to /opt/deckard, and
# the release flow reads the root VERSION file (release.config.mjs,
# .gitlab-ci.yml build:flatpak). No [project]/[build-system] table on purpose.

[tool.ruff]
target-version = "py313"   # deployment floor: flatpak GNOME 50 runtime / AUR python313

[tool.ruff.lint]
select = [
  "F401",  # unused imports
  "E711",  # == None / != None
  "E712",  # == True / == False
  "B006",  # mutable default args — shared silently across every default caller
  "F541",  # f-strings without placeholders
  "E722",  # bare `except:` — house style is a narrow except or @log.catch
  "B030",  # `except` handlers that aren't exception classes/tuples
]

[tool.mypy]
python_version = "3.13"
files = ["src", "GtkHelper"]
mypy_path = "."
explicit_package_bases = true   # src/ has no __init__.py files; imports are `src.backend...` from repo root
ignore_missing_imports = true   # dasbus, evdev, pulsectl, StreamDeck, ... ship no stubs
implicit_optional = true        # large pre-PEP-484 population; ratchet later

# Zero errors under THIS config is not "fully type-checked": the tree reached
# zero without changing a single value above, so the blind spots the defaults
# leave are still there. Ratchet candidates, each a separate campaign (each
# would resurface a batch of real errors):
#
#   check_untyped_defs    -- bodies of unannotated defs are not checked at all;
#                            e.g. the ActionCore has_*_control derefs, which are
#                            invisible today. Biggest blind spot by volume.
#   warn_unreachable      -- `if x is None:` on a non-Optional narrows to
#                            uninhabited and the branch body is SILENTLY SKIPPED,
#                            so a wrong late-init annotation reads as clean
#                            (it once hid seven real optionals).
#   implicit_optional     -- `def f(x: str = None)` is silently rewritten to
#                            `str | None`, so parameter lies never surface.
#   warn_unused_ignores   -- stale `# type: ignore`s do not self-report; finding
#                            them needs a manual diagnostic run.
#   disallow_any_generics -- bare generics decay to Any; DeckController.inputs
#                            (list[Any]) is the load-bearing example.
